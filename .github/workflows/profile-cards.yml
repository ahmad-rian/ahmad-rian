name: Generate Profile Summary Cards

on:
  schedule:
    - cron: "0 */12 * * *" # refresh tiap 12 jam
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: vn7n24fzkq/github-profile-summary-cards@v0.13.0
        env:
          # Pakai PAT (SUMMARY_GITHUB_TOKEN) kalau ada, fallback ke token bawaan
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          TIME_ZONE: Asia/Jakarta
          THEME: tokyonight
          ANIMATION: load
